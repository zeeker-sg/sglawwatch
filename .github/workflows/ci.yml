name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pin Python instead of using the runner's system interpreter. The
      # ubuntu-latest image moved to 3.14, which pyo3-based deps (built
      # from source by maturin) don't support yet. 3.12 matches
      # sync-headlines.yml and requires-python.
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest